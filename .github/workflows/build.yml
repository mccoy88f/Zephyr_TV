# Checks that every push builds and passes the unit tests. No signing: releases are release.yml's job.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # Lint errors fail the build (warnings don't); the full report goes to the log.
      - name: Lint
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt torrent/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          # The errors again at the end, so they're the last lines of the log
          ./gradlew --no-daemon lintDebug || { cat $report 2>/dev/null; echo "::group::Errors only"; grep -A3 ": Error:" $report 2>/dev/null; echo "::endgroup::"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zephyr-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            torrent/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: ignore
