# Builds the signed ZephyrTV.apk and publishes it as a GitHub release, which the in-app updater reads, with the torrent
# engine (ZephyrTorrent.apk, torrent/: Zephyr TV installs it from its own version's release) and Zephyr TV Receiver
# for webOS (ZephyrTVReceiver.ipk and its Homebrew Channel manifest). Those two change seldom: each is built again
# only when its files changed since the last release (or when asked, "Build everything"), else copied from it.
# Runs when a v* tag is pushed, or by hand from the Actions tab (it then tags the commit itself).
# The release version is versionName in app/build.gradle.kts; its notes are that version's CHANGELOG.md section.
#
# Signing uses one fixed key, from these repository secrets (Settings → Secrets and variables → Actions):
#   ZEPHYR_KEYSTORE_BASE64  the .jks keystore, base64-encoded
#   ZEPHYR_KEYSTORE_PASSWORD, ZEPHYR_KEY_ALIAS, ZEPHYR_KEY_PASSWORD
# Every release must be signed with the same key, or Android refuses to install it over the previous one.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      everything:
        description: Build everything (the torrent engine and the Receiver too, even unchanged)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the last release's tag, to see what changed since

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "Version $ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $ver"; exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZEPHYR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZEPHYR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZEPHYR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZEPHYR_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ZEPHYR_KEYSTORE_* secrets are missing. Without the fixed key a release couldn't update the previous one."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zephyr.jks"
          {
            echo "storeFile=$RUNNER_TEMP/zephyr.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # The last release (not this one, when run again): its engine and Receiver are taken as they are when their
      # files haven't changed since its tag.
      - name: What to build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.ver }}
          EVERYTHING: ${{ inputs.everything }}
        run: |
          prev=$(gh release list --limit 30 --json tagName,isDraft -q '[.[] | select(.isDraft | not) | .tagName | select(. != "v'"$VER"'")][0] // ""')
          echo "Last release: ${prev:-none}"
          mkdir -p prev
          [ -n "$prev" ] && gh release download "$prev" -D prev -p ZephyrTorrent.apk -p ZephyrTVReceiver.ipk -p 'link.mccoy88f.zephyr.receiver.manifest.json' || true
          changed() { [ "$EVERYTHING" = true ] || [ -z "$prev" ] || ! git rev-parse -q --verify "refs/tags/$prev" >/dev/null || ! git diff --quiet "$prev" HEAD -- "$@"; }
          if changed torrent/ gradle.properties || [ ! -f prev/ZephyrTorrent.apk ]; then echo "torrent=true" >> "$GITHUB_OUTPUT"; echo "Torrent engine: built"
          else echo "torrent=false" >> "$GITHUB_OUTPUT"; echo "Torrent engine: as in $prev"; fi
          if changed webos/ site/public/receiver/ || [ ! -f prev/ZephyrTVReceiver.ipk ] || [ ! -f prev/link.mccoy88f.zephyr.receiver.manifest.json ]; then
            echo "receiver=true" >> "$GITHUB_OUTPUT"; echo "Receiver: built"
          else echo "receiver=false" >> "$GITHUB_OUTPUT"; echo "Receiver: as in $prev"; fi

      - name: Build and test
        run: ./gradlew --no-daemon testDebugUnitTest :app:assembleRelease ${{ steps.build.outputs.torrent == 'true' && ':torrent:assembleRelease' || '' }}

      - name: Torrent engine
        run: |
          if [ "${{ steps.build.outputs.torrent }}" = true ]; then cp torrent/build/outputs/apk/release/torrent-release.apk ZephyrTorrent.apk
          else cp prev/ZephyrTorrent.apk ZephyrTorrent.apk; fi

      # Zephyr TV Receiver (webos/): the webOS app that plays what Zephyr TV sends it, packaged by LG's own tools.
      - uses: actions/setup-node@v4
        if: steps.build.outputs.receiver == 'true'
        with:
          node-version: '20'

      - name: Zephyr TV Receiver (webOS), as in the last release
        if: steps.build.outputs.receiver != 'true'
        run: cp prev/ZephyrTVReceiver.ipk prev/link.mccoy88f.zephyr.receiver.manifest.json .

      - name: Zephyr TV Receiver (webOS)
        if: steps.build.outputs.receiver == 'true'
        run: |
          npm install -g @webos-tools/cli@3.2.6
          command -v convert >/dev/null || sudo apt-get install -y imagemagick # the icons, from the shared one
          webos/package.sh webos-out
          cp webos-out/*.ipk ZephyrTVReceiver.ipk
          # Homebrew Channel's manifest of this .ipk (its repository, ztv.mccoy88f.link/webos.json, points at the
          # latest release's): its version, the .ipk beside it, its SHA-256 and size.
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const app = JSON.parse(fs.readFileSync("webos/app/appinfo.json", "utf8"));
            const v = /var VERSION = "([0-9.]+)"/.exec(fs.readFileSync("site/public/receiver/platform.js", "utf8"))[1];
            const ipk = fs.readFileSync("ZephyrTVReceiver.ipk");
            fs.writeFileSync("link.mccoy88f.zephyr.receiver.manifest.json", JSON.stringify({
              id: app.id, version: v, type: "web", title: app.title,
              appDescription: "Plays what Zephyr TV sends it with Send to, from the account'"'"'s other devices.",
              iconUri: "https://ztv.mccoy88f.link/receiver/icon.png", sourceUrl: "https://github.com/mccoy88f/Zephyr_TV",
              rootRequired: false, ipkUrl: "ZephyrTVReceiver.ipk",
              ipkHash: { sha256: crypto.createHash("sha256").update(ipk).digest("hex") }, ipkSize: ipk.length,
            }, null, 2));
          '

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ZephyrTV.apk
          # This version's CHANGELOG section, up to the next heading of any level.
          awk -v v="## $VER" '$0 == v {on = 1; next} on && /^#/ {exit} on' CHANGELOG.md > notes.md
          # A beta ("4.0.0-beta.1") is a pre-release: the in-app updater reads releases/latest, which leaves those out.
          pre=""; case "$VER" in *-*) pre="--prerelease";; esac
          gh release create "v$VER" ZephyrTV.apk ZephyrTorrent.apk ZephyrTVReceiver.ipk link.mccoy88f.zephyr.receiver.manifest.json --title "Zephyr TV $VER" --notes-file notes.md --target "$GITHUB_SHA" $pre
