# Checks that Zephyr TV Receiver (webos/) packages: its service reads as JavaScript, and LG's tools make its .ipk, kept
# as an artifact to install by hand. The release workflow packages it the same way and attaches it to the release.
name: webOS

on:
  push:
    paths: ['webos/**', 'tizen/**', 'package.json', 'site/public/receiver/**', '.github/workflows/webos.yml']
  pull_request:
    paths: ['webos/**', 'tizen/**', 'package.json', 'site/public/receiver/**', '.github/workflows/webos.yml']

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and package
        run: |
          node --check webos/service/service.js
          for f in site/public/receiver/*.js; do node --check "$f"; done
          # One version for every TV: platform.js's, as package.json (TizenBrew's module) says it too.
          v="$(sed -n 's/.*var VERSION = "\([0-9.]*\)".*/\1/p' site/public/receiver/platform.js)"
          node -e "const p=require('./package.json'); if (p.version !== '$v') { console.error('package.json says ' + p.version + ', platform.js ' + '$v'); process.exit(1) }"
          npm install -g @webos-tools/cli@3.2.6
          command -v convert >/dev/null || sudo apt-get install -y imagemagick # the icons, from the shared one
          webos/package.sh webos-out

      - uses: actions/upload-artifact@v4
        with:
          name: zephyr-tv-receiver
          path: webos-out/*.ipk
