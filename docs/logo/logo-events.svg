<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
  </defs>
  <g transform="translate(256, 256) scale(1.2) translate(-256, -256)">
    <!-- Calendar / event -->
    <rect x="140" y="150" width="232" height="180" rx="16" fill="#083344" stroke="url(#grad)" stroke-width="10"/>
    <rect x="140" y="150" width="232" height="40" rx="16" fill="#22D3EE"/>
    <rect x="140" y="174" width="232" height="16" fill="#22D3EE"/>
    <!-- Dots for days -->
    <circle cx="180" cy="230" r="8" fill="#22D3EE"/>
    <circle cx="220" cy="230" r="8" fill="#67E8F9" opacity="0.6"/>
    <circle cx="260" cy="230" r="8" fill="#22D3EE"/>
    <circle cx="300" cy="230" r="8" fill="#67E8F9" opacity="0.6"/>
    <circle cx="180" cy="270" r="8" fill="#67E8F9" opacity="0.6"/>
    <circle cx="220" cy="270" r="8" fill="#22D3EE"/>
    <circle cx="260" cy="270" r="8" fill="#67E8F9" opacity="0.6"/>
    <circle cx="300" cy="270" r="8" fill="#22D3EE"/>
    <text x="256" y="400" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#22D3EE" text-anchor="middle" letter-spacing="2">EVENTS</text>
  </g>
</svg>